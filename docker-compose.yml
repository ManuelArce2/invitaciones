services:
  postgres:
    image: postgres:17-alpine
    container_name: invitaciones-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invitaciones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esta_password}
      POSTGRES_DB: ${POSTGRES_DB:-invitaciones}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks: [invitaciones]

  backend:
    build: ./backend
    container_name: invitaciones-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-invitaciones}:${POSTGRES_PASSWORD:-cambia_esta_password}@postgres:5432/${POSTGRES_DB:-invitaciones}
      STORAGE_PATH: /app/storage
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
    volumes:
      - ./storage:/app/storage
    depends_on:
      - postgres
    networks: [invitaciones]

  frontend:
    build: ./frontend
    container_name: invitaciones-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks: [invitaciones]

volumes:
  postgres_data:

networks:
  invitaciones:
    driver: bridge
